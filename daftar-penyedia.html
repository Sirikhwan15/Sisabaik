<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1,">
        <meta
        name="description"
        content="Formulir prototipe untuk mendaftarkan usaha sebagai penyedia makanan di Sisabaik.">
        <title>Daftar Penyedia | Sisabaik</title>
        </head>
    <body>
        <a href="#konten-utama">Lewati konten utama</a>

        <header>
            <p><strong>Sisabaik</strong></p>
            <nav aria-label="Navigasi utama">
                <ul>
                    <li><a href="index.html">Beranda</a></li>
                    <li><a href="daftar-penyedia.html" aria-current="page">Daftar sebagai Penyedia</a></li>
                    <li><a href="tawarkan-makanan.html">Tawarkan makanan</a></li>
                </ul>
            </nav>
        </header>

        <main id="konten-utama"tabindex="-1">
            <h1>Daftar sebagai Penyedia Sisabaik</h1>
            <p>
                Gunakan data fiktif selama praktikum. Formulir ini belum terhubung ke server basis data.
            </p>
            <p id="petunjuk-wajib">kolom bertanda <strong>*</strong> wajib diisi.</p>

            <form
            action="daftar-penyedia.html"
            method="get"
            aria-describedby="petunjuk-wajib"
            >
            <fieldset>
                <legend>Informasi Usaha</legend>

                <p>
                    <label for ="nama-usaha">Nama usaha *</label><br>
                    <input type="text" 
                    name="nama-usaha" 
                    id="nama-usaha" 
                    autocomplete="organization"
                    minlength="3"
                    maxlength="100"
                    required>
                </p>

                <p>
                    <label for="jenis-usaha">Jenis usaha *</label><br>
                    <select id="jenis-usaha" name="jenis-usaha" required>
                        <option value="">Pilih jenis usaha</option>
                        <option value="warung">Warung</option>
                        <option value="restoran">Restoran</option>
                        <option value="katering">Katering</option>
                        <option value="ritel">Ritel</option>
                        <option value="hotel">Hotel</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                </p>
                
            </fieldset>
        </main>
</html>
